    <style>
      /* Barre de défilement globale standard et visible */
      html {
        scrollbar-gutter: stable; /* Empêche le saut de mise en page quand la barre apparaît */
      }
      
      ::-webkit-scrollbar {
        width: 12px; /* Largeur classique */
        height: 12px;
      }
      
      ::-webkit-scrollbar-track {
        background: #f3f4f6; /* Gris très clair */
      }
      
      ::-webkit-scrollbar-thumb {
        background: #9ca3af; /* Gris moyen pour visibilité */
        border-radius: 6px;
        border: 3px solid #f3f4f6; /* Espace autour du curseur */
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; /* Plus sombre au survol */
      }

      /* Barre interne fine pour les petits rails horizontaux uniquement */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border: 1px solid transparent;
      }
    </style>
